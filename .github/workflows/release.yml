name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-assets:
    uses: ./.github/workflows/build-matrix.yml
    with:
      checkout_ref: ${{ github.ref_name }}
      build_type: Release
      windows_preset: windows-msvc-ninja-release
      windows_artifact_dir: build/windows-msvc-ninja/Release
      artifact_prefix: release
      cache_key_prefix: release-

  upload-artifacts:
    name: Upload artifacts to release
    runs-on: ubuntu-latest
    needs: build-release-assets
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts

      - name: Upload artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**/*.dll
            release-artifacts/**/*.pdb
            release-artifacts/**/*.so
            release-artifacts/**/*.dylib
          fail_on_unmatched_files: false
          overwrite_files: true