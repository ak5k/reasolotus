name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in semver form, for example 0.3.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and capture version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ github.event.inputs.version }}'

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match <major>.<minor>.<patch>" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Inject version into CMakeLists.txt
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          perl -0pi -e "s/project\(reasolotus VERSION [0-9]+\.[0-9]+\.[0-9]+ LANGUAGES C CXX\)/project(reasolotus VERSION ${version} LANGUAGES C CXX)/" CMakeLists.txt

      - name: Commit version update and create tag
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          tag='${{ steps.version.outputs.tag }}'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add CMakeLists.txt

          if git diff --cached --quiet; then
            echo "CMakeLists.txt already contains version ${version}; skipping commit"
          else
            git commit -m "release: ${version} [skip ci]"
            git push origin HEAD
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin; reusing it"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

  build-release-assets:
    needs: prepare-release
    uses: ./.github/workflows/build-matrix.yml
    with:
      checkout_ref: ${{ needs.prepare-release.outputs.tag }}
      build_type: Release
      artifact_prefix: release
      cache_key_prefix: release-

  upload-artifacts:
    name: Upload artifacts to release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release-assets]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts

      - name: Upload artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**/*.dll
            release-artifacts/**/*.pdb
            release-artifacts/**/*.so
            release-artifacts/**/*.dylib
          fail_on_unmatched_files: false
          overwrite_files: true